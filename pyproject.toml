[project]
name = "pit-crew"
version = "0.1.0"
description = "An autonomous agent that makes CI faster and proves it still catches every bug."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
