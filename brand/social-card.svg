    <text x="28" y="34" fill="#B84DFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.16em">PURPLE SECTOR // LATEST VERDICT</text>
    <text x="28" y="78" fill="#F4F4F7" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700">-42.8%</text>
    <text x="192" y="78" fill="#00E676" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700">12/12 BUGS</text>
    <text x="412" y="78" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="600">p = 0.004</text>
    <rect x="572" y="42" width="84" height="36" rx="8" fill="#00E676" fill-opacity="0.16" stroke="#00E676"/>
    <text x="614" y="65" text-anchor="middle" fill="#00E676" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">KEEP</text>
  </g>

