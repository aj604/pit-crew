  <!-- Brand Lockup -->
  <g transform="translate(80, 148)">
    <g transform="scale(1.85)">
      <path d="M12 10H42C51.5 10 57 15.6 57 24.5C57 33.4 51.5 39 42 39H25.5L19 52H8.5L17.5 34H40.5C44.8 34 47.2 31.3 47.2 24.5C47.2 17.7 44.8 15 40.5 15H17L12 10Z" fill="url(#sc-r)"/>
      <path d="M11 21H37.5L33.5 29H11V21Z" fill="#F4F4F7"/>
      <path d="M31.5 44H56.5L52.5 52H27.5L31.5 44Z" fill="url(#sc-n)"/>
    </g>
    <text x="136" y="84" fill="#F4F4F7" font-family="'Chakra Petch', 'Titillium Web', sans-serif" font-size="86" font-weight="700" font-style="italic" letter-spacing="0.06em">PIT CREW</text>
  </g>

  <!-- Headline & Subhead -->
  <text x="84" y="330" fill="#F4F4F7" font-family="'Titillium Web', 'Inter', sans-serif" font-size="34" font-weight="700">Faster CI. Proven on every bug.</text>
  <text x="84" y="376" fill="#9E9EB3" font-family="'Inter', sans-serif" font-size="24">Autonomous managed deep agent for CI optimization.</text>
  <text x="84" y="410" fill="#9E9EB3" font-family="'Inter', sans-serif" font-size="24">The agent proposes. Deterministic code judges.</text>

