    <g transform="translate(16, 228)">
      <rect width="356" height="68" rx="10" fill="#15151E" stroke="#4D3E16"/>
      <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#FFD000"/>
      <text x="20" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03</text>
      <text x="50" y="28" fill="#F4F4F7" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">PRF</text>
      <text x="102" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="12">PROOF</text>
      <text x="338" y="28" text-anchor="end" fill="#FFD000" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">12 REPLAYS</text>
      <text x="50" y="52" fill="#7D7D94" font-family="'JetBrains Mono', monospace" font-size="11">red_commits: 10 + 2 synth</text>
