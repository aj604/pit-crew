      <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#00F0FF"/>
      <text x="20" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01</text>
      <text x="50" y="28" fill="#F4F4F7" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">ANA</text>
      <text x="102" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="12">ANALYSIS</text>
      <text x="338" y="28" text-anchor="end" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">HYPOTHESIS</text>
      <text x="50" y="52" fill="#7D7D94" font-family="'JetBrains Mono', monospace" font-size="11">critical_path: pytest (312s)</text>
