    <!-- Row 2: OPT -->
    <g transform="translate(16, 148)">
      <rect width="356" height="68" rx="10" fill="#15151E" stroke="#3F265C"/>
      <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#B84DFF"/>
      <text x="20" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02</text>
      <text x="50" y="28" fill="#F4F4F7" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">OPT</text>
      <text x="102" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="12">OPTIMIZER</text>
      <text x="338" y="28" text-anchor="end" fill="#B84DFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">-142.4s</text>
      <text x="50" y="52" fill="#7D7D94" font-family="'JetBrains Mono', monospace" font-size="11">compound: shard-by-timing</text>
