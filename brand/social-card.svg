<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B11"/>
      <stop offset="55%" stop-color="#15151E"/>
      <stop offset="100%" stop-color="#21102D"/>
    </linearGradient>
    <radialGradient id="sc-sphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 175) scale(360 320)">
      <stop offset="0%" stop-color="#FF008C" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#B84DFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#15151E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-red" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 560) scale(460 280)">
      <stop offset="0%" stop-color="#FF1E00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF1E00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-r" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1E00"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>
    <linearGradient id="sc-n" x1="12" y1="54" x2="58" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B84DFF"/>
      <stop offset="55%" stop-color="#FF008C"/>
      <stop offset="100%" stop-color="#FF1E00"/>
    </linearGradient>
    <pattern id="sc-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0L0 0 0 36" fill="none" stroke="#242436" stroke-width="1"/>
    </pattern>
    <pattern id="sc-kerb" width="64" height="10" patternUnits="userSpaceOnUse">
      <rect width="32" height="10" fill="#FF1E00"/>
      <rect x="32" width="32" height="10" fill="#F4F4F7"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#sc-bg)"/>
  <rect width="1280" height="640" fill="url(#sc-grid)" opacity="0.48"/>
  <rect width="1280" height="640" fill="url(#sc-sphere)"/>
  <rect width="1280" height="640" fill="url(#sc-red)"/>

  <!-- Top Strip Neon Bar -->
  <rect x="0" y="0" width="440" height="5" fill="#FF1E00"/>
  <rect x="440" y="0" width="420" height="5" fill="#FF008C"/>
  <rect x="860" y="0" width="420" height="5" fill="#B84DFF"/>

  <!-- Left Column: Identity -->
  <g transform="translate(80, 66)">
    <!-- 5-Light Gantry Pill -->
    <rect width="340" height="36" rx="18" fill="#0E0E15" stroke="#2D2D44" stroke-width="1.5"/>
    <circle cx="24" cy="18" r="5.5" fill="#FF1E00"/>
    <circle cx="44" cy="18" r="5.5" fill="#FF1E00"/>
    <circle cx="64" cy="18" r="5.5" fill="#FF1E00"/>
    <circle cx="84" cy="18" r="5.5" fill="#FF1E00"/>
    <circle cx="104" cy="18" r="5.5" fill="#00E676"/>
    <text x="124" y="22" fill="#D4D4E2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.14em">LAS VEGAS NIGHT SPEC</text>
