      <text x="20" y="28" fill="#00E676" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">05</text>
      <text x="50" y="28" fill="#F4F4F7" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">RAT</text>
      <text x="102" y="28" fill="#9EE6C0" font-family="'JetBrains Mono', monospace" font-size="12">RATER</text>
      <text x="338" y="28" text-anchor="end" fill="#00E676" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">VERDICT: KEEP</text>
      <text x="50" y="52" fill="#8CD9B2" font-family="'JetBrains Mono', monospace" font-size="11">exact_perm_test: p=0.004 OK</text>
