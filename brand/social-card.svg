    <g transform="translate(16, 334)">
      <rect width="356" height="68" rx="10" fill="#15151E" stroke="#4D1A28"/>
      <rect x="0" y="0" width="5" height="68" rx="2.5" fill="#FF008C"/>
      <text x="20" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">04</text>
      <text x="50" y="28" fill="#F4F4F7" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">DSP</text>
      <text x="102" y="28" fill="#9494A8" font-family="'JetBrains Mono', monospace" font-size="12">FORK CI</text>
      <text x="338" y="28" text-anchor="end" fill="#FF008C" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">N=10 RUNS</text>
